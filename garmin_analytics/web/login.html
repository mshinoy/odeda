<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in · Garmin Analytics</title>
<link rel="stylesheet" href="/static/style.css">
</head>
<body class="login-body">

<main class="login-card">
  <h1>Garmin Analytics</h1>
  <p class="sub">This deployment is protected by a single password.</p>

  <form id="login-form" autocomplete="on">
    <label for="password">Password</label>
    <input type="password" id="password" name="password" autocomplete="current-password"
           required autofocus>
    <button type="submit" id="submit">Sign in</button>
    <p class="error" id="error" hidden></p>
  </form>

  <p class="foot">
    Set by the <code>APP_PASSWORD</code> environment variable. It is stored only as a
    salted PBKDF2 hash — never in plaintext.
  </p>
</main>

<script>
'use strict';
const form = document.getElementById('login-form');
const errorEl = document.getElementById('error');
const submit = document.getElementById('submit');

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  errorEl.hidden = true;
  submit.disabled = true;
  submit.textContent = 'Checking…';
  try {
    const res = await fetch('/api/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ password: document.getElementById('password').value }),
    });
    if (!res.ok) {
      let detail = res.statusText;
      try { detail = (await res.json()).detail || detail; } catch (_) { /* not JSON */ }
      throw new Error(detail);
    }
    window.location.href = '/';
  } catch (err) {
    errorEl.textContent = String(err.message || err);
    errorEl.hidden = false;
    submit.disabled = false;
    submit.textContent = 'Sign in';
    document.getElementById('password').select();
  }
});
</script>
</body>
</html>
