# Single-tenant by design: one deployment is one person's data.
# `docker compose up -d` is the entire install.

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      # Baked into the JavaScript bundle at build time (see .env.example); unset
      # ones fall back to the frontend's defaults.
      args:
        VITE_MAPBOX_TOKEN: ${VITE_MAPBOX_TOKEN:-}
        VITE_MAP_STYLE_LIGHT: ${VITE_MAP_STYLE_LIGHT:-}
        VITE_MAP_STYLE_DARK: ${VITE_MAP_STYLE_DARK:-}
    image: garmin-analytics:latest
    container_name: garmin-analytics
    restart: unless-stopped

    # Bound to localhost by default. Change to "8000:8000" only once APP_PASSWORD
    # is set and you have thought about who can reach the port.
    ports:
      - "127.0.0.1:${GA_PUBLIC_PORT:-8000}:8000"

    env_file:
      - .env

    environment:
      # Paths inside the container; the volume below is mounted at /data.
      GA_DATA_DIR: /data
      GA_DB: /data/garmin.db
      GA_RAW_DIR: /data/raw_archive
      GA_TOKEN_DIR: /data/tokens

    volumes:
      # The database, the raw payload archive and the Garmin token cache.
      # A named volume, so `docker compose down` does not delete years of history.
      - garmin-data:/data

    healthcheck:
      test:
        - CMD
        - python
        - -c
        - |
          import urllib.request, sys
          sys.exit(0 if urllib.request.urlopen(
              "http://127.0.0.1:8000/api/health", timeout=4).status == 200 else 1)
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

    # Modest hardening: the app writes only to /data and never needs new privileges.
    security_opt:
      - no-new-privileges:true

  # -------------------------------------------------------------------------
  # Development only (the `dev` profile): watch work in progress live on :5173.
  # Neither service is part of the install, and starting them never touches `app`:
  #
  #   docker compose --profile dev up -d --no-deps api-dev ui-dev   # open :5173
  #   docker compose --profile dev restart api-dev   # fresh copy of the real data
  #   docker compose --profile dev stop api-dev ui-dev
  #
  # ui-dev is Vite on this checkout's frontend/ (reloads on every edit); its /api
  # goes to api-dev, the API from this checkout's garmin_analytics/ (restarts on
  # every edit), which serves a COPY of the real database taken when it starts.
  # -------------------------------------------------------------------------

  # The app's own image, so the Python dependencies match production; the code comes
  # from the checkout instead (PYTHONPATH), read-only. A new dependency in
  # requirements.txt needs `docker compose build app` first.
  api-dev:
    profiles: [dev]
    image: garmin-analytics:latest
    container_name: garmin-analytics-api-dev
    env_file:
      - .env
    environment:
      PYTHONPATH: /src
      # The copy lives in this service's own volume. The token cache starts empty,
      # so this backend is never signed in to Garmin and cannot sync — and the
      # automatic sync is off besides, so a reload never tries.
      GA_AUTO_SYNC_HOURS: "0"
      GA_DATA_DIR: /data
      GA_DB: /data/garmin.db
      GA_RAW_DIR: /data/raw_archive
      GA_TOKEN_DIR: /data/tokens
    working_dir: /src
    entrypoint:
      - sh
      - -c
      - |
        set -e
        mkdir -p /data/raw_archive /data/tokens && chmod 700 /data/tokens
        # SQLite's online backup, reading the live file read-only (safe while app runs).
        python -c "
        import sqlite3
        src = sqlite3.connect('file:/live/garmin.db?mode=ro', uri=True)
        dst = sqlite3.connect('/data/garmin.db')
        src.backup(dst)
        n = dst.execute('SELECT count(*) FROM activities').fetchone()[0]
        print(f'api-dev: fresh copy of the real database, {n} activities')
        "
        exec garmin-analytics serve --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./garmin_analytics:/src/garmin_analytics:ro
      # The real data. Not mounted :ro because SQLite reads a WAL database through its
      # shared-memory file, which a read-only mount can't hold; the copy above opens it
      # with mode=ro, and nothing else in this service touches /live.
      - garmin-data:/live
      - api-dev-data:/data
    security_opt:
      - no-new-privileges:true

  ui-dev:
    profiles: [dev]
    image: node:24-bookworm-slim
    container_name: garmin-analytics-ui-dev
    working_dir: /app/frontend
    # npm ci only when the lockfile is newer than the installed modules.
    command:
      - sh
      - -c
      - |
        [ node_modules/.package-lock.json -nt package-lock.json ] || npm ci --no-audit --no-fund
        exec npx vite --host 0.0.0.0 --port 5173 --strictPort
    environment:
      # Wins over VITE_API_URL in frontend/.env. Point it at http://app:8000 to try
      # the UI against the running app instead.
      VITE_API_URL: http://api-dev:8000
    ports:
      - "127.0.0.1:${GA_UI_DEV_PORT:-5173}:5173"
    volumes:
      - ./frontend:/app/frontend
      # The container's own node_modules (and Vite's cache in it), so the host's
      # are never overwritten and no root-owned files land in the checkout.
      - ui-dev-node-modules:/app/frontend/node_modules
    security_opt:
      - no-new-privileges:true

volumes:
  garmin-data:
    name: garmin-analytics-data
  ui-dev-node-modules:
  api-dev-data:
