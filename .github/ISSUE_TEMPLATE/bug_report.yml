name: Something is broken
description: Ingestion stopped, a page shows wrong numbers, or the app will not start
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Garmin's unofficial API moves without notice, so "sync stopped working" is the most
        likely report. The output of `doctor` answers most of the questions up front. It
        lists versions, paths and endpoint health and **no credentials**, but read it
        before you paste it.
  - type: textarea
    id: happened
    attributes:
      label: What happened, and what did you expect?
      description: The page or command, and the exact error if there was one.
    validations:
      required: true
  - type: textarea
    id: doctor
    attributes:
      label: Output of doctor
      description: "Run `docker compose exec app garmin-analytics doctor` (or `garmin-analytics doctor` without Docker)."
      render: text
    validations:
      required: true
  - type: dropdown
    id: signin
    attributes:
      label: How did you sign in to Garmin?
      options:
        - Email and password in Settings
        - Browser sign-in (the ticket route)
        - Garmin's data export, no sign-in
        - Not applicable
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Optional, but it helps if the problem is on one page or one activity.
