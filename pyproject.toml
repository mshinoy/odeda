[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "odeda"
version = "0.2.0"
description = "Personal analytics over Garmin Connect data: training load, recovery trends, performance and race readiness."
# 3.12 is garminconnect's floor; the image was already on 3.12.
requires-python = ">=3.12"
dependencies = [
    # Garmin fingerprints the login route, so this cascades through five login
    # strategies rather than betting on one profile. Pulls curl_cffi in itself.
    "garminconnect==0.3.16",
    "fitdecode==0.11.0",
    "fastapi==0.141.1",
    "uvicorn[standard]==0.53.0",
]

[project.scripts]
odeda = "odeda.cli:main"

[tool.setuptools.packages.find]
include = ["odeda*"]

[tool.setuptools.package-data]
# ui/ is the React build (`npm run build` in frontend/), gitignored; a wheel built
# without it still installs and serves the API, and says how to build the UI.
odeda = ["db/*.sql", "ui/*", "ui/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
