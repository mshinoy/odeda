[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "garmin-analytics"
version = "0.1.0"
description = "Personal analytics over Garmin Connect data: training load, recovery trends, performance and race readiness."
# 3.12 is garminconnect's floor; the image was already on 3.12.
requires-python = ">=3.12"
dependencies = [
    # Garmin fingerprints the login route, so this cascades through five login
    # strategies rather than betting on one profile. Pulls curl_cffi in itself.
    "garminconnect==0.3.16",
    "fitdecode==0.11.0",
    "fastapi==0.141.1",
    "uvicorn[standard]==0.53.0",
]

[project.scripts]
garmin-analytics = "garmin_analytics.cli:main"

[tool.setuptools.packages.find]
include = ["garmin_analytics*"]

[tool.setuptools.package-data]
garmin_analytics = ["db/*.sql", "web/*", "web/vendor/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
